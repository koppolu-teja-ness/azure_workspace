id: vn-004
azureResourceType: Microsoft.Network/virtualNetworks/virtualNetworkPeerings
awsResourceType: AWS::EC2::VPCPeeringConnection
propertyMappings:
  - source: allowForwardedTraffic
    target: Route table propagation and SG rules
    notes: Peering route controls require explicit route table updates.
preconditions:
  - CIDR ranges between VPCs are non-overlapping.
securityConstraints:
  - Cross-account peering acceptance must be least privilege.
knownIncompatibilities:
  - Transitive routing expectations may differ.
fallbackStrategy: Fall back to Transit Gateway design when peering is insufficient.
