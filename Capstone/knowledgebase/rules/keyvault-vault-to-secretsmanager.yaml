id: kv-001
azureResourceType: Microsoft.KeyVault/vaults
awsResourceType: AWS::SecretsManager::Secret
propertyMappings:
  - source: properties.enablePurgeProtection
    target: RecoveryWindowInDays
    notes: Preserve recovery semantics where possible.
preconditions:
  - Vault is discoverable and not soft-deleted.
securityConstraints:
  - Secret policies must not allow wildcard principals.
knownIncompatibilities:
  - Azure soft-delete retention granularity differs by service.
fallbackStrategy: Set recovery window to nearest allowed value and require review.
confidenceScore: 0.9
citations:
  - https://learn.microsoft.com/azure/key-vault/general/soft-delete-overview
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/reference_secret_json_structure.html
mappingQuality: approximate
