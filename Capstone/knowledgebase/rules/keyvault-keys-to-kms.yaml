id: kv-002
azureResourceType: Microsoft.KeyVault/vaults/keys
awsResourceType: AWS::KMS::Key
propertyMappings:
  - source: keyOps
    target: KeyPolicy
    notes: Translate key operation permissions into key policy statements.
preconditions:
  - Key type is RSA or EC supported by KMS.
securityConstraints:
  - Key policy must be scoped to required IAM principals only.
knownIncompatibilities:
  - Some HSM and rotation modes are not 1:1.
fallbackStrategy: Use customer-managed KMS key with explicit policy and manual review.
confidenceScore: 0.82
citations:
  - https://learn.microsoft.com/azure/key-vault/keys/about-keys
  - https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html
mappingQuality: approximate
