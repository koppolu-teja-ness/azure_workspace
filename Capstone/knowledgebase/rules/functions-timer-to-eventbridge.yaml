id: fn-002
azureResourceType: Microsoft.Web/sites/functions/timerTrigger
awsResourceType: AWS::Events::Rule
propertyMappings:
  - source: schedule
    target: ScheduleExpression
    notes: NCRONTAB must be converted to cron/rate syntax.
preconditions:
  - Schedule is representable in EventBridge expression format.
securityConstraints:
  - Rule invoke permission must reference only target function.
knownIncompatibilities:
  - NCRONTAB semantics and timezone support differ.
fallbackStrategy: Preserve schedule intent with closest cron expression and mark drift risk.
confidenceScore: 0.8
citations:
  - https://learn.microsoft.com/azure/azure-functions/functions-bindings-timer
  - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-rule-schedule.html
mappingQuality: approximate
