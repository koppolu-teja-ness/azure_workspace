id: fn-003
azureResourceType: Microsoft.Web/sites/functions/queueTrigger
awsResourceType: AWS::Lambda::EventSourceMapping + AWS::SQS::Queue
propertyMappings:
  - source: queueName
    target: EventSourceArn
    notes: Queue identity maps to SQS ARN.
preconditions:
  - Queue payload and retry expectations are documented.
securityConstraints:
  - Lambda role must have least-privilege SQS permissions.
knownIncompatibilities:
  - Poison queue handling defaults may differ.
fallbackStrategy: Create DLQ and conservative batch size defaults with review.
confidenceScore: 0.86
citations:
  - https://learn.microsoft.com/azure/azure-functions/functions-bindings-storage-queue-trigger
  - https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html
mappingQuality: approximate
