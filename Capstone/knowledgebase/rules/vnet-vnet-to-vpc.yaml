id: vn-001
azureResourceType: Microsoft.Network/virtualNetworks
awsResourceType: AWS::EC2::VPC
propertyMappings:
  - source: properties.addressSpace.addressPrefixes
    target: CidrBlock
    notes: Primary CIDR maps directly; secondary ranges may require additional design.
preconditions:
  - CIDR blocks do not conflict with existing target account networks.
securityConstraints:
  - DNS hostnames and support should be explicitly configured.
knownIncompatibilities:
  - Azure service endpoints do not map directly to VPC service endpoints.
fallbackStrategy: Create endpoint strategy as separate design step and require review.
confidenceScore: 0.9
citations:
  - https://learn.microsoft.com/azure/virtual-network/virtual-networks-overview
  - https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
mappingQuality: exact
