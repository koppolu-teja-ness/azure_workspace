services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: migration_kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./knowledge_base/schema/pgvector_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata:
