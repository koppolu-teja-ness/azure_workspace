name: Docker Build
on: [push]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build root API image
        run: docker build -t migration-assistant-api:latest .
      - name: Build API image from infra Dockerfile
        run: docker build -f infra/docker/api.Dockerfile -t migration-assistant-api-infra:latest .
      - name: Build dashboard image
        run: docker build -f infra/docker/dashboard.Dockerfile -t migration-assistant-dashboard:latest .
      - name: Validate compose file
        run: docker compose config

