name: CD
on:
  push:
    branches: [main]
jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        run: pytest -q
      - name: Build API and dashboard images
        run: |
          docker build -f infra/docker/api.Dockerfile -t migration-assistant-api:main .
          docker build -f infra/docker/dashboard.Dockerfile -t migration-assistant-dashboard:main .

